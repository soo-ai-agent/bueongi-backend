# 백엔드(Kotlin/Spring) 회귀 게이트 — 소스 변경 시 gradle test 를 돌린다.
# 한글 테스트 메서드명 컴파일을 위해 UTF-8 로케일 고정(로케일 불일치 시 InvalidPathException).
name: backend-ci

on:
  push:
    branches: [main, 'feat/**', 'claude/**']
    paths-ignore: ['docs/**', 'deploy/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'deploy/**', '**.md']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # context 태그 테스트(@SpringBootTest, PostGIS 저장소)가 붙는 DB
      BUEONGI_DB_URL: jdbc:postgresql://localhost:5432/bueongi?reWriteBatchedInserts=true
      BUEONGI_DB_USERNAME: bueongi
      BUEONGI_DB_PASSWORD: bueongi
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bueongi
          POSTGRES_USER: bueongi
          POSTGRES_PASSWORD: bueongi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bueongi -d bueongi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test (gradle)
        run: ./gradlew test --no-daemon

      - name: Upload test report (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: '**/build/reports/tests/test'
          retention-days: 7

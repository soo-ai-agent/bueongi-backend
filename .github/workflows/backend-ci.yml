# 백엔드(Kotlin/Spring) 회귀 게이트 — 소스 변경 시 gradle test 를 돌린다.
# 한글 테스트 메서드명 컴파일을 위해 UTF-8 로케일 고정(로케일 불일치 시 InvalidPathException).
name: backend-ci

on:
  push:
    branches: [main, 'feat/**', 'claude/**']
    paths-ignore: ['docs/**', 'deploy/**', 'pipeline/**', 'cdn/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'deploy/**', 'pipeline/**', 'cdn/**', '**.md']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test (gradle)
        run: ./gradlew test --no-daemon

      - name: Upload test report (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: '**/build/reports/tests/test'
          retention-days: 7

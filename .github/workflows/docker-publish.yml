# 백엔드 컨테이너 이미지 발행 — main push 와 v* 태그에서 테스트 통과 후
# GHCR(ghcr.io/<owner>/<repo>)로 push 한다. cdn/ 데이터가 이미지에 구워진다.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # context 태그 테스트(@SpringBootTest, PostGIS 저장소)가 붙는 DB - backend-ci.yml 과 같다
      BUEONGI_DB_URL: jdbc:postgresql://localhost:5432/bueongi?reWriteBatchedInserts=true
      BUEONGI_DB_USERNAME: bueongi
      BUEONGI_DB_PASSWORD: bueongi
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bueongi
          POSTGRES_USER: bueongi
          POSTGRES_PASSWORD: bueongi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bueongi -d bueongi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (gradle)
        run: ./gradlew test --no-daemon

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# support:monitoring 소유 설정 — actuator 노출 범위(헬스/인포만, 시크릿 상세 비노출).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 운영 알림(Slack Incoming Webhook). URL 미설정이면 알림 전체 비활성(무해).
bueongi:
  alert:
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    # 같은 알림 key 의 재발송 억제 창(분) — 장애 중 폭주 방지.
    throttle-minutes: ${SLACK_ALERT_THROTTLE_MINUTES:10}

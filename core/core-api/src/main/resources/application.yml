server:
  port: 8119

spring:
  application:
    name: bueongi-backend
  # 관리자 시설 CSV 업로드(POST /api/admin/facilities/{type}/upload) 파일 상한 — 전국 표준데이터 대비 넉넉히.
  servlet:
    multipart:
      max-file-size: ${BUEONGI_FACILITY_UPLOAD_MAX_SIZE:64MB}
      max-request-size: ${BUEONGI_FACILITY_UPLOAD_MAX_SIZE:64MB}
  # 모듈별 설정 합성(soo-spring-kotlin-starter 방식) — 각 모듈이 자기 설정 파일을 소유한다.
  config:
    import:
      - logging.yml
      - monitoring.yml
      - db-core.yml
      - client-tmap.yml
      - client-kakao.yml
      - client-datagokr.yml
      - client-safemap.yml

# 안심 귀가 도메인 설정(부팅 모듈 소유분 — API 계층·공유 URL).
bueongi:
  jwt:
    # 관리자 인증(/api/admin/**)용 RS256 공개키. soo-auth-service 발급 토큰을 오프라인 검증한다.
    # 운영은 반드시 JWT_PUBLIC_KEY 로 주입(미주입 시 JwtProperties fail-fast 로 startup 중단).
    public-key: ${JWT_PUBLIC_KEY:}
    # 발급자 식별(auth-service 규약). 현재 검증엔 미사용(공개키 서명 검증이 신뢰근거).
    issuer: ${JWT_ISSUER:soo-auth}
  cors:
    # 프론트 dev 서버(strictPort=3619). dev 가 https(자체서명)로 전환되어 https origin 이 기본이고,
    # 과거 http dev 도 함께 허용한다. 운영 도메인은 환경변수로 덮어쓴다.
    allowed-origins: ${BUEONGI_CORS_ORIGINS:https://localhost:3619,http://localhost:3619}
  facility:
    # 안심시설 라이브 갱신 주기(cron, Asia/Seoul). 기본 매월 1일 04:00 — DATA_GO_KR_SERVICE_KEY 가 있을 때만 동작.
    refresh-cron: ${BUEONGI_FACILITY_REFRESH_CRON:0 0 4 1 * *}
  share:
    # 보호자 공유 URL 의 base. 앱이 받는 share_url = {base-url}/share/{token}. 운영은 공개 도메인으로 덮어쓴다.
    base-url: ${BUEONGI_SHARE_BASE_URL:http://localhost:8119}

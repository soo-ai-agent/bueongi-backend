server:
  port: 8080

spring:
  application:
    name: bueongi-backend
  # 관리자 시설 CSV 업로드(POST /api/admin/facilities/{type}/upload) 파일 상한 — 전국 표준데이터 대비 넉넉히.
  servlet:
    multipart:
      max-file-size: ${BUEONGI_FACILITY_UPLOAD_MAX_SIZE:64MB}
      max-request-size: ${BUEONGI_FACILITY_UPLOAD_MAX_SIZE:64MB}
  # 외부 API(Tmap·Kakao) 호출 타임아웃 — 자동구성 RestClient.Builder 에 전역 적용된다.
  # 미설정 시 무한대라, 외부가 응답을 지연시키는 슬로우 장애에서 워커 스레드가 무한 점유돼 전체 장애로 번진다.
  # 모든 클라이언트가 이 빌더를 clone().build() 해 쓰므로 이 한 곳으로 전부 적용된다.
  http:
    client:
      connect-timeout: ${BUEONGI_HTTP_CONNECT_TIMEOUT:3s}
      read-timeout: ${BUEONGI_HTTP_READ_TIMEOUT:10s}
  # 모듈별 설정 합성(soo-spring-kotlin-starter 방식) — 각 모듈이 자기 설정 파일을 소유한다.
  config:
    import:
      - logging.yml
      - monitoring.yml
      - db-core.yml
      - client-tmap.yml
      - client-kakao.yml

# 안심 귀가 도메인 설정(부팅 모듈 소유분 — API 계층·공유 URL).
bueongi:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    private-key: ${JWT_PRIVATE_KEY:}
    issuer: ${JWT_ISSUER:bueongi}
  app-info:
    # 배포 파이프라인이 프론트 배포 시 채운다 — 서버는 프론트 버전을 스스로 알 수 없다
    frontend-version: ${BUEONGI_FRONTEND_VERSION:}
  admin-auth:
    login-id: ${BUEONGI_ADMIN_LOGIN_ID:}
    password-hash: ${BUEONGI_ADMIN_PASSWORD_HASH:}
    email: ${BUEONGI_ADMIN_EMAIL:}
    access-token-seconds: ${BUEONGI_ADMIN_ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${BUEONGI_ADMIN_REFRESH_TOKEN_SECONDS:604800}
  cors:
    # 프론트 dev 서버(strictPort=3619). dev 가 https(자체서명)로 전환되어 https origin 이 기본이고,
    # 과거 http dev 도 함께 허용한다. 운영 도메인은 환경변수로 덮어쓴다.
    allowed-origins: ${BUEONGI_CORS_ORIGINS:https://localhost:3619,http://localhost:3619}
  facility:
    # 시설 데이터는 파이프라인이 만든 CDN 파일이 원천이다(백엔드는 외부 API 를 직접 부르지 않는다).
    # 경로는 각 컴포넌트의 @Value 기본값(data-dir=../cdn, cctv-csv, upload-dir)을 쓰고 필요할 때만 덮어쓴다.
  share:
    # 보호자 공유 URL 의 base. 앱이 받는 share_url = {base-url}/share/{token}. 운영은 공개 도메인으로 덮어쓴다.
    base-url: ${BUEONGI_SHARE_BASE_URL:http://localhost:8119}
    # 미도착 감시 스캔 주기(ms). 활성 공유 중 '예정 도착 초과 + 위치 정지'를 주기적으로 찾아 운영자에게 알린다.
    watchdog-interval-ms: ${BUEONGI_WATCHDOG_INTERVAL_MS:60000}

# bueongi 운영 스택 — 프론트(nginx SPA+프록시) + 백엔드(Spring 8119) + redis [+ caddy TLS]
#
# 사용:
#   cp .env.example .env  # 값 채우기
#   docker compose pull && docker compose up -d                  # 기본(HTTP, 리버스 프록시 뒤)
#   docker compose --profile tls up -d                           # Caddy 자동 HTTPS 포함
#
# 중요: 위치(geolocation)·클립보드 등 브라우저 보안 컨텍스트 API 때문에
# 공개 배포는 반드시 HTTPS 여야 한다(tls 프로필 또는 앞단 TLS 프록시).
name: bueongi

services:
  backend:
    image: ghcr.io/soo-ai-agent/bueongi-backend:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # 외부 API 키(없으면 결정론적 폴백으로 동작 — safe-compare 목업 경로, 시드 장소검색)
      TMAP_APP_KEY: ${TMAP_APP_KEY:-}
      # 공공데이터포털 키(없으면 시설 라이브 갱신 비활성 — 이미지에 구운 cdn/ 데이터로 동작)
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      SAFEMAP_SERVICE_KEY: ${SAFEMAP_SERVICE_KEY:-}
      SAFETYDATA_SERVICE_KEY: ${SAFETYDATA_SERVICE_KEY:-}
      # 보호자 공유 URL base = 사용자에게 보이는 공개 origin (share_url = {base}/share/{token})
      BUEONGI_SHARE_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BUEONGI_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # 위치공유 저장소(필수)
      BUEONGI_REDIS_URL: ${BUEONGI_REDIS_URL:-redis://redis:6379}
      # 안심시설 저장소(필수, PostgreSQL + PostGIS)
      BUEONGI_DB_URL: ${BUEONGI_DB_URL:-jdbc:postgresql://db:5432/bueongi?reWriteBatchedInserts=true}
      BUEONGI_DB_USERNAME: ${BUEONGI_DB_USERNAME:-bueongi}
      BUEONGI_DB_PASSWORD: ${BUEONGI_DB_PASSWORD:?BUEONGI_DB_PASSWORD 를 .env 에 넣어야 합니다}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:8119/api/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  frontend:
    image: ghcr.io/soo-ai-agent/bueongi:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://backend:8119
    ports:
      - '${HTTP_PORT:-8080}:80'

  # 안심시설 저장소. postgis 이미지는 postgis 확장을 미리 만들어 둔다.
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: bueongi
      POSTGRES_USER: ${BUEONGI_DB_USERNAME:-bueongi}
      POSTGRES_PASSWORD: ${BUEONGI_DB_PASSWORD:?BUEONGI_DB_PASSWORD 를 .env 에 넣어야 합니다}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${BUEONGI_DB_USERNAME:-bueongi} -d bueongi']
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - db-data:/var/lib/postgresql/data

  # 위치공유 저장소. TTL 은 백엔드가 키별로 건다.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data

  # 자동 HTTPS(선택): --profile tls. DOMAIN 의 인증서를 Let's Encrypt 로 자동 발급/갱신.
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - '80:80'
      - '443:443'
    environment:
      # tls 프로필 사용 시 필수(.env 의 DOMAIN). 비어 있으면 Caddy 가 기동 로그로 알려준다.
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:

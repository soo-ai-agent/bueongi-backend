server:
  port: 8119

spring:
  application:
    name: bueongi-backend

# 안심 귀가 도메인 설정. 외부 지도 API 키가 없으면 시드 데이터(결정론적)로 동작하고,
# 키가 주입되면(추후) 실연동으로 확장할 수 있게 분리해둔다. 프론트 계약(응답 형태)은 동일.
bueongi:
  places:
    # Kakao Local REST 키. 미설정(빈 값)이면 내장 시드 카탈로그로 검색한다.
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
  facility:
    # 안심시설(CDN) 데이터 디렉터리. 미설정이면 backend 실행 경로 기준 ../cdn(= apps/bueongi/cdn).
    # 디렉터리가 없으면 빈 인덱스로 동작하고, safe-compare 는 점수 0/마커 없이 진행된다.
    data-dir: ${BUEONGI_FACILITY_DATA_DIR:../cdn}
    # 전국 CCTV 실데이터 CSV(CP949/MS949 인코딩). 있으면 JSON CCTV 와 합쳐 적재한다.
    # 파일이 없으면 경고 로그 후 건너뛴다(죽지 않음).
    cctv-csv: ${BUEONGI_FACILITY_CCTV_CSV:CCTV정보.csv}
  tmap:
    # Tmap 보행자 경로 AppKey. 미설정(빈 값)이면 safe-compare 가 결정론적 폴백(compare)로 동작한다.
    app-key: ${TMAP_APP_KEY:}
  cors:
    # 프론트 dev 서버(strictPort=3619). dev 가 https(자체서명)로 전환되어 https origin 이 기본이고,
    # 과거 http dev 도 함께 허용한다. 운영 도메인은 환경변수로 덮어쓴다.
    allowed-origins: ${BUEONGI_CORS_ORIGINS:https://localhost:3619,http://localhost:3619}
  share:
    # 보호자 공유 URL 의 base. 앱이 받는 share_url = {base-url}/share/{token}. 운영은 공개 도메인으로 덮어쓴다.
    base-url: ${BUEONGI_SHARE_BASE_URL:http://localhost:8119}
    # Redis 접속 URL(예: redis://localhost:6379). 미설정(빈 값)이면 인메모리 폴백으로 동작(외부 인프라 불요).
    redis-url: ${BUEONGI_REDIS_URL:}

# A-4 / D-2 자치구별 좌표계·컬럼 매핑
# 자치구별로 좌표계와 컬럼명이 제각각인 원천을 표준 스키마로 변환하기 위한 규칙.
#
# 각 항목의 status:
#   verified    좌표계 확정. 정상 변환 대상.
#   quarantined 좌표계 미확정/불명확. 변환하지 않고 격리 리포트로만 보고(PM 보고 대상).
#
# coordSystem: wgs84 | epsg5179 | epsg5174 | address | unknown
# unknown 또는 status=quarantined 인 원천은 통합 JSON에 병합하지 않는다.
#
# 신규 자치구 원천을 추가할 때 이 파일에 한 줄을 추가하고 status 를 검토한다.

version: 1

# ---- A-4 자치구 안심귀갓길 ----
A-4:
  defaults:
    status: quarantined        # 명시 전까지 기본 격리. 검증 후 verified 로 승격.
    coordSystem: unknown
  districts:
    - sigungu: "26110"          # 부산 중구 (예시)
      name: "부산광역시 중구 안심귀갓길"
      status: verified
      coordSystem: wgs84
      columns: { lat: "위도", lng: "경도", name: "구간명", address: "위치" }
    - sigungu: "27110"          # 대구 중구 (예시)
      name: "대구광역시 중구 안심귀갓길"
      status: verified
      coordSystem: epsg5179
      columns: { x: "X", y: "Y", name: "노선명", address: "주소" }
    - sigungu: "29110"          # 광주 동구 (예시, 좌표계 미확정)
      name: "광주광역시 동구 안심귀갓길"
      status: quarantined
      coordSystem: unknown
      columns: { name: "구간", address: "설치위치" }
      reason: "원천 메타에 좌표계 표기 없음. 담당 자치구 확인 필요."

# ---- D-2 자치구 비상벨 보완 ----
D-2:
  defaults:
    status: quarantined
    coordSystem: unknown
  districts:
    - sigungu: "26110"          # 부산 중구 (예시)
      name: "부산광역시 중구 비상벨 보완"
      status: verified
      coordSystem: wgs84
      columns: { lat: "위도", lng: "경도", name: "설치장소", address: "주소", manager: "관리기관" }
    - sigungu: "41135"          # 성남 분당구 (예시)
      name: "성남시 분당구 비상벨 보완"
      status: verified
      coordSystem: epsg5174
      columns: { x: "TM_X", y: "TM_Y", name: "설치위치", address: "지번주소", manager: "관리부서" }
    - sigungu: "48121"          # 창원 성산구 (예시, 좌표계 미확정)
      name: "창원시 성산구 비상벨 보완"
      status: quarantined
      coordSystem: unknown
      columns: { name: "위치", address: "주소" }
      reason: "X/Y 단위·원점 불명확. 좌표계 확인 전까지 병합 보류."

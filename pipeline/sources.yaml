# 안심귀가(부엉이) Data Pipeline — 원천 API 계약
# 표준 산출물 좌표계: WGS84 {lat,lng} (EPSG:4326)
# 기준 문서: docs/mvp-orchestrator-design.md (작업 2)
#
# coordSystem 값:
#   wgs84        원천이 이미 위경도. 범위 검증만.
#   epsg5179     UTM-K (GRS80). proj4 변환.
#   epsg5174     Bessel 중부원점 TM. proj4 변환.
#   per-district 자치구별 상이. config/district-coord-map.yaml 로 결정.
#
# cadence 값: monthly | quarterly | manual
# output: CDN 산출 경로. {sigungu} 는 시군구코드로 분할.

version: 1
standardCrs: "EPSG:4326"

sources:
  # ---- A 그룹 (자치구 안심귀갓길 — 서울 외) ----
  - id: A-4
    name: "자치구 안심귀갓길"
    type: safepath
    coordSystem: per-district          # 자치구별 좌표계 상이 → district-coord-map
    districtMapKey: "A-4"
    cadence: manual                    # 자치구별 수집 파일 기반
    merge: { strategy: union, into: "safepath/all.json" }
    output: "safepath/all.json"
    keyColumns: { name: "노선명", address: "주소", geometry: "경로좌표" }
    notes: "원천별 coordSystem 메타 기록. 불명확 건은 quarantine 리포트."

  # ---- B 그룹 (전국 표준 시설) ----
  - id: B-1
    name: "전국 CCTV 표준데이터"
    catalogId: "15013094"
    type: cctv
    coordSystem: wgs84
    cadence: monthly
    splitBy: sigungu
    output: "cctv/{sigungu}.json"
    keyColumns: { lat: "위도", lng: "경도", name: "관리기관명", address: "소재지지번주소", sigungu: "시군구코드", purpose: "설치목적구분", cameraCount: "카메라대수" }

  # ---- C 그룹 (조명·보행신호) ----
  - id: C-1
    name: "서울특별시 가로등 위치정보"
    catalogId: "OA-22205"
    type: lamp
    coordSystem: wgs84
    cadence: monthly
    output: "lamp/seoul.json"
    keyColumns: { lat: "위도", lng: "경도", name: "관리번호", address: "설치위치" }
    notes: "열린데이터광장은 파일로만 개방(openapi service 없음). 운영 입력은 data/csv/C-1.csv, 라이브는 포털 미러 15107934 의 odcloud 자동변환(uddi 확정 필요)."

  - id: C-4
    name: "전국 스마트가로등 표준데이터"
    catalogId: "tn_pubr_public_smart_streetlight_api"
    type: lamp
    coordSystem: wgs84
    cadence: monthly
    output: "lamp/smart.json"
    keyColumns: { lat: "위도", lng: "경도", name: "도로명", address: "소재지지번주소", sigungu: "제공기관코드" }
    notes: "CSV 전용 투입(data/csv/C-4.csv). 좌표 100%(12,714행 실측) — 공주·서산·화순·홍성 등."

  - id: C-2
    name: "전국 보안등 표준데이터"
    catalogId: "15017320"
    type: security_lamp
    coordSystem: wgs84
    cadence: monthly
    splitBy: sigungu
    output: "security_lamp/{sigungu}.json"
    keyColumns: { lat: "위도", lng: "경도", name: "보안등위치명", address: "소재지지번주소", sigungu: "제공기관코드" }

  - id: C-3
    name: "서울특별시 보행등(보행신호등) 위도 경도 현황"
    catalogId: "OA-22354"
    type: pedestrian_signal
    coordSystem: wgs84
    cadence: monthly
    output: "pedestrian_signal/seoul.json"
    keyColumns: { lat: "위도", lng: "경도", name: "신호등 종류", address: "주소" }
    notes: "이름은 보행'등'이지만 조명이 아니라 보행신호등이다(항목: 자치구·신호등 종류·위도·경도·주소). 조명 밀도 점수에 섞이면 안 되므로 lamp 와 분리한다. 열린데이터광장은 파일 전용 — 운영 입력은 data/csv/C-3.csv, 라이브는 포털 미러 15124273 의 odcloud 자동변환(uddi 확정 필요)."
